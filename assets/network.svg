<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- A small self-healing network: a link drops, traffic reroutes, the link comes back -->
  <rect width="300" height="300" fill="#000000"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="22" cy="30" r="1"/><circle cx="270" cy="22" r="1.2"/><circle cx="250" cy="275" r="1"/>
    <circle cx="40" cy="260" r="1.2"/><circle cx="150" cy="18" r="0.8"/><circle cx="285" cy="150" r="0.8"/>
    <circle cx="12" cy="160" r="0.9"/><circle cx="190" cy="288" r="0.9"/>
  </g>

  <g stroke="#6e6e6e" stroke-width="1.5">
    <line x1="150" y1="60" x2="70" y2="130"/>
    <line x1="150" y1="60" x2="230" y2="130"/>
    <line x1="70" y1="130" x2="100" y2="230"/>
    <line x1="230" y1="130" x2="200" y2="230"/>
    <line x1="100" y1="230" x2="200" y2="230"/>
    <line x1="70" y1="130" x2="230" y2="130"/>
  </g>

  <!-- The link that fails and heals -->
  <line x1="150" y1="60" x2="150" y2="150" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;1;0.15;0.15;1;1" keyTimes="0;0.3;0.35;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line x1="150" y1="150" x2="150" y2="230" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;1;0.15;0.15;1;1" keyTimes="0;0.3;0.35;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Packets: straight down while healthy, around the side while the link is down -->
  <circle r="4" fill="#ffffff">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1;1;0;1" keyTimes="0;0.3;0.35;0.7;0.75;1" calcMode="linear" path="M150 60 L150 230"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.3;0.31;0.74;0.75;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#ffffff" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.35;0.7;1" calcMode="linear" path="M150 60 L230 130 L200 230"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.7;0.71;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g fill="#000000" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="60" r="10"/>
    <circle cx="70" cy="130" r="8"/>
    <circle cx="230" cy="130" r="8"/>
    <circle cx="150" cy="150" r="8"/>
    <circle cx="100" cy="230" r="8"/>
    <circle cx="200" cy="230" r="10"/>
  </g>
  <circle cx="150" cy="150" r="8" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="8;8;16;8;8" keyTimes="0;0.7;0.75;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.8;0;0" keyTimes="0;0.7;0.75;0.8;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="150" y="278" text-anchor="middle" fill="#9a9a9a"
        font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="11">detect · reroute · heal</text>
</svg>
